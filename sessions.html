<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sessions — learning with gioia</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      --page-bg: #d6eaf8;           /* used by nav gradient to match page bg */
      background-color: #d6eaf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1rem 4rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      transition: background-color 0.6s ease;
    }
    /* Background turns slightly deeper blue when nav is open */
    body.nav-active { --page-bg: #b8d9f0; background-color: #b8d9f0; }

    /* ── Fade-up entry animation ────────────────────────────────── */

    


    /* ── Form container ─────────────────────────────────────────── */
    .form-container {
      width: min(90vw, 420px);
      margin-top: 1rem;
      animation: fadeUp 0.6s ease both;
    }

    /* ── Page heading ───────────────────────────────────────────── */
    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #1a1a1a;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ── Form field wrapper ─────────────────────────────────────── */
    .field { margin-bottom: 1.4rem; }

    /* ── Field labels ───────────────────────────────────────────── */
    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 0.4rem;
    }

    /* ── Text inputs and textarea ───────────────────────────────── */
    input, textarea, select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #1a1a1a;
      padding: 0.4rem 0;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 300;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea { resize: none; height: 80px; }
    select { cursor: pointer; appearance: none; -webkit-appearance: none; }

    /* ── Submit button ──────────────────────────────────────────── */
    button[type="submit"] {
      margin-top: 2rem;
      display: block;
      width: 100%;
      background: #1a1a1a;
      color: #d6eaf8;
      border: none;
      padding: 0.9rem;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button[type="submit"]:hover { background: #ffffff; color: #1a1a1a; }

    @media (max-width: 500px) {
      h1 { font-size: 1.6rem; margin-bottom: 1.8rem; }
      input, textarea, select { font-size: 0.9rem; }
      button[type="submit"] { padding: 0.8rem; font-size: 0.75rem; }
    }

    html[data-device="mobile"] body      { padding: 4rem 1rem 3rem; }
    html[data-device="mobile"] h1        { font-size: 1.55rem; margin-bottom: 1.6rem; }
    html[data-device="mobile"] .form-container { width: 94vw; }
    html[data-device="mobile"] input,
    html[data-device="mobile"] select,
    html[data-device="mobile"] textarea  { font-size: 16px; }
    html[data-device="mobile"] button[type="submit"] { padding: 0.85rem; font-size: 0.78rem; min-height: 48px; }
    html[data-device="tablet"] body      { padding: 4.5rem 2rem 4rem; }
    html[data-device="tablet"] h1        { font-size: 1.8rem; }
    html[data-device="tablet"] .form-container { width: min(80vw, 460px); }
    html[data-device="tablet"] input,
    html[data-device="tablet"] select,
    html[data-device="tablet"] textarea  { font-size: 16px; }
    html[data-device="tablet"] button[type="submit"] { min-height: 48px; }
    html[data-touch="true"] button[type="submit"]:hover  { background: #1a1a1a; color: #d6eaf8; }
    html[data-touch="true"] button[type="submit"]:active { background: #ffffff; color: #1a1a1a; }
  

    .container {
      width: min(92vw, 520px);
      margin-top: 1rem;
      animation: fadeUp 0.6s ease both;
    }
    h1 {
      font-size: 2rem; font-weight: 300; letter-spacing: 0.08em;
      color: #1a1a1a; margin-bottom: 0.4rem; text-align: center;
    }
    .subtitle {
      text-align: center; font-size: 0.82rem; letter-spacing: 0.08em;
      color: #888; margin-bottom: 2.8rem;
    }
    .course-block {
      margin-bottom: 2.8rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #ddd;
    }
    .course-block:last-child { border-bottom: none; }
    .course-code {
      font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: #888; margin-bottom: 0.4rem;
    }
    .session-count {
      font-size: 1rem; color: #1a1a1a; margin-bottom: 1.6rem; line-height: 1.6;
    }
    .progress-bar-wrap {
      height: 3px; background: #e8e8e8; margin-bottom: 1.6rem; border-radius: 2px;
    }
    .progress-bar {
      height: 100%; background: #1a1a1a; border-radius: 2px;
      transition: width 0.4s ease;
    }
    .session-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .session-row:last-child { border-bottom: none; }
    .session-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .session-dot.completed  { background: #1a1a1a; }
    .session-dot.scheduled  { background: #ccc; border: 1px solid #999; }
    .session-dot.cancelled  { background: #e8e8e8; }
    .session-date { font-size: 0.88rem; color: #555; flex: 1; }
    .session-label {
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa;
    }
    .rebook-note {
      margin-top: 1.2rem; font-size: 0.82rem; color: #888;
      font-style: italic; line-height: 1.6;
    }
    .rebook-note a { color: #1a1a1a; }
    .error-state { text-align: center; padding: 3rem 0; color: #888; font-size: 0.9rem; line-height: 1.8; }
    html[data-device="mobile"] .container { width: 96vw; }
    html[data-device="mobile"] h1 { font-size: 1.5rem; }
  </style>
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>

  <div class="container" id="content">
    <div class="error-state">loading…</div>
  </div>

  <script src="nav.js"></script>
  <script>
    /* ── Student sessions page ───────────────────────────────────────────
       Reads the access token from the URL (?token=...) and fetches
       the student's session data from the API. No login required —
       the token acts as the credential.                               */

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('de-CH', {
        weekday: 'short', day: '2-digit', month: '2-digit',
        year: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    async function load() {
      const token   = new URLSearchParams(window.location.search).get('token');
      const content = document.getElementById('content');

      if (!token) {
        content.innerHTML = '<div class="error-state">No session link provided.<br>Please use the link sent to you by your teacher.</div>';
        return;
      }

      try {
        const res  = await fetch('/api/student-sessions?token=' + encodeURIComponent(token));
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (!data.courses || !data.courses.length) {
          content.innerHTML = '<h1>your sessions</h1><p style="text-align:center;color:#888;margin-top:2rem;">No sessions found yet.</p>';
          return;
        }

        const name = [data.student.firstName, data.student.lastName].filter(Boolean).join(' ');
        const level = data.student.level ? ` · ${data.student.level}` : '';

        let html = `<h1>your sessions</h1><p class="subtitle">${name}${level}</p>`;

        data.courses.forEach(course => {
          const total     = course.sessions_total;
          const completed = course.sessions_completed || 0;
          const remaining = total ? total - completed : null;
          const pct       = total ? Math.min(100, Math.round(completed / total * 100)) : 0;

          const countLine = total
            ? `${completed} of ${total} sessions completed · ${remaining} remaining`
            : `${completed} sessions completed`;

          const rebookNote = total && remaining <= 3 && remaining > 0
            ? `<p class="rebook-note">You have ${remaining} session${remaining === 1 ? '' : 's'} remaining. Ready to continue? <a href="/booking.html">Make a new enquiry →</a></p>`
            : total && remaining === 0
            ? `<p class="rebook-note">Your current block is complete. <a href="/booking.html">Book your next block →</a></p>`
            : '';

          const sessionRows = course.sessions.map(s => `
            <div class="session-row">
              <div class="session-dot ${s.status}"></div>
              <div class="session-date">${fmtDate(s.scheduled_at)}</div>
              <div class="session-label">${s.status}</div>
            </div>
          `).join('');

          html += `
            <div class="course-block">
              <p class="course-code">${course.course_code} · ${course.service || ''} ${course.level ? '· ' + course.level : ''}</p>
              <p class="session-count">${countLine}</p>
              ${total ? `<div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>` : ''}
              ${sessionRows || '<p style="font-size:0.82rem;color:#aaa;">No sessions scheduled yet.</p>'}
              ${rebookNote}
            </div>`;
        });

        content.innerHTML = html;
      } catch {
        content.innerHTML = '<div class="error-state">Could not load your sessions.<br>Please check your link or contact your teacher.</div>';
      }
    }

    load();
  </script>

</body>
</html>
