<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Details — Learning with Gioia</title>
  <meta name="description" content="Complete your booking enquiry with Learning with Gioia.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="learning with gioia">
  <meta property="og:title"       content="Your Details — Learning with Gioia">
  <meta property="og:description" content="Complete your booking enquiry with Learning with Gioia.">
  <meta property="og:url"         content="https://oiagi.org/contact-details.html">
  <meta property="og:image"       content="https://oiagi.org/gioia_logo.png">
  <!-- Twitter/X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Your Details — Learning with Gioia">
  <meta name="twitter:description" content="Complete your booking enquiry with Learning with Gioia.">
  <meta name="twitter:image"       content="https://oiagi.org/gioia_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact-details.css">
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">skip to content</a>

  <div class="form-container" id="main">
    <h1>your details</h1>
    <p class="step-indicator">Step 2 of 2</p>

    <div style="display:flex; gap:1rem;">
      <div class="field" style="flex:1;">
        <label for="lead-first">first name</label>
        <input type="text" id="lead-first" name="lead_first" autocomplete="given-name" />
        <div class="error" id="err-lead-first">Please enter a first name.</div>
      </div>
      <div class="field" style="flex:1;">
        <label for="lead-last">last name</label>
        <input type="text" id="lead-last" name="lead_last" autocomplete="family-name" />
        <div class="error" id="err-lead-last">Please enter a last name.</div>
      </div>
    </div>

    <div class="field">
      <label for="lead-email">email</label>
      <input type="email" id="lead-email" name="lead_email" autocomplete="email" />
      <div class="error" id="err-lead-email">Please enter an email address.</div>
    </div>

    <div class="field">
      <label for="lead-phone">phone</label>
      <input type="tel" id="lead-phone" name="lead_phone" autocomplete="tel" />
      <div class="error" id="err-lead-phone">Please enter a phone number.</div>
    </div>

    <div class="field">
      <label for="preferred-contact">preferred contact method</label>
      <select id="preferred-contact" name="preferred_contact">
        <option value="" disabled selected></option>
        <option value="Email">Email</option>
        <option value="Phone">Phone</option>
        <option value="Either">Either</option>
      </select>
      <div class="error" id="err-preferred-contact">Please select a preferred contact method.</div>
    </div>

    <button class="submit" id="continue-btn">continue →</button>
    <div class="error" id="submit-error" style="display:none;text-align:center;margin-top:1rem;">
      Something went wrong — please try again or email us at
      <a href="mailto:info@oiagi.org">info@oiagi.org</a>.
    </div>

  </div><!-- /.form-container -->

  <script src="nav.js"></script>
  <script>
    /* ══════════════════════════════════════════════════════════════════
       CONTACT DETAILS — simplified
       Fields: first name, last name, email, phone, preferred contact method
    ══════════════════════════════════════════════════════════════════ */

    const booking = JSON.parse(sessionStorage.getItem('booking') || '{}');

    document.getElementById('continue-btn').addEventListener('click', async () => {
      let valid = true;

      function err(id, show) {
        const el = document.getElementById(id);
        if (el) el.style.display = show ? 'block' : 'none';
      }

      const leadFirst = document.getElementById('lead-first').value.trim();
      err('err-lead-first', !leadFirst); if (!leadFirst) valid = false;

      const leadLast = document.getElementById('lead-last').value.trim();
      err('err-lead-last', !leadLast); if (!leadLast) valid = false;

      const leadEmail = document.getElementById('lead-email').value.trim();
      err('err-lead-email', !leadEmail); if (!leadEmail) valid = false;

      const leadPhone = document.getElementById('lead-phone').value.trim();
      err('err-lead-phone', !leadPhone); if (!leadPhone) valid = false;

      const preferredContact = document.getElementById('preferred-contact').value;
      err('err-preferred-contact', !preferredContact); if (!preferredContact) valid = false;

      if (!valid) {
        /* Scroll to first visible error and focus its input */
        const container = document.querySelector('.form-container');
        const first = [...container.querySelectorAll('.error')].find(e => e.style.display === 'block');
        if (first) {
          first.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const input = first.closest('.field, .field-row')?.querySelector('input, select, textarea');
          if (input) input.focus({ preventScroll: true });
        }
        return;
      }

      const contact = {
        lead: {
          firstName: leadFirst,
          lastName:  leadLast,
          email:     leadEmail,
          phone:     leadPhone,
        },
        preferredContact,
      };

      /* ── Submit ─────────────────────────────────────────────────── */
      const btn = document.getElementById('continue-btn');
      btn.dataset.loading = '';
      btn.disabled        = true;

      try {
        const res = await fetch('/api/submit-enquiry', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ booking, contact }),
        });
        if (!res.ok) throw new Error('Server error');
        sessionStorage.removeItem('booking');
        window.location.href = 'thankyou.html';
      } catch {
        delete btn.dataset.loading;
        btn.disabled = false;
        document.getElementById('submit-error').style.display = 'block';
      }
    });

  </script>

</body>
</html>
