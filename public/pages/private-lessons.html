<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/course.css">
  <link rel="stylesheet" href="/content.css">
  <script src="/device-detect.js"></script>
</head>
<body>

  <main class="course-page" id="content">
    <p class="kicker" id="private-kicker">courses &amp; tutoring</p>
    <h1 id="private-h1">Private lessons</h1>
    <p class="course-intro" id="private-intro"></p>

    <div class="course-facts course-facts--three">
      <div class="fact">
        <span class="fact__label" id="private-fact-1-label"></span>
        <span class="fact__value" id="private-fact-1-value"></span>
        <span class="fact__unit" id="private-fact-1-unit"></span>
      </div>
      <div class="fact">
        <span class="fact__label" id="private-fact-2-label"></span>
        <span class="fact__value" id="private-fact-2-value"></span>
        <span class="fact__unit" id="private-fact-2-unit"></span>
      </div>
      <div class="fact">
        <span class="fact__label" id="private-fact-3-label"></span>
        <span class="fact__value" id="private-fact-3-value"></span>
        <span class="fact__unit" id="private-fact-3-unit"></span>
      </div>
    </div>

    <div class="content-sections">
      <section class="content-section">
        <h2 id="private-why-title"></h2>
        <p id="private-why-body"></p>
        <p class="content-pull" id="private-why-pull"></p>
      </section>

      <section class="content-section">
        <h2 id="private-how-title"></h2>
        <p id="private-how-body"></p>
        <ul id="private-how-list"></ul>
      </section>

      <section class="content-section">
        <h2 id="private-where-title"></h2>
        <p id="private-where-body"></p>
      </section>

      <section class="content-section">
        <h2 id="private-price-title"></h2>
        <p id="private-price-body"></p>
      </section>

      <section class="content-section">
        <h2 id="private-faq-title"></h2>
        <div class="faq-list" id="private-faq-list"></div>
      </section>

      <section class="content-section">
        <h2 id="private-links-title"></h2>
        <div class="content-links" id="private-links"></div>
      </section>
    </div>

    <div class="course-actions">
      <a class="btn btn--solid" id="private-cta-enquiry" href="/enquiry.html">make an enquiry</a>
      <a class="btn btn--ghost" id="private-cta-call" href="/index.html#start">book a free 15-minute call</a>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/nav.js"></script>

</body>
</html>
