          <h2>Stellung im Satz</h2>
          <p>
            Subjunktionen leiten <strong>Nebensätze</strong> ein. Das finite Verb steht im Nebensatz
            normalerweise <strong>am Ende</strong>: <em>Ich bleibe, weil ich lernen muss.</em>
            Wenn der Nebensatz vorne steht, folgt im Hauptsatz direkt das finite Verb:
            <em>Weil ich lernen muss, bleibe ich.</em>
          </p>
        </aside>
