<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/admin/admin.css?v=cert-cache-20260601">
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="/device-detect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────── -->
  <div id="login-screen">
    <h1>admin</h1>
    <div class="field">
      <label for="admin-email">email</label>
      <input type="email" id="admin-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="admin-pwd">password</label>
      <input type="password" id="admin-pwd" autocomplete="current-password" />
      <div class="error-msg" id="pwd-error">Invalid email or password.</div>
    </div>
    <button class="submit" id="login-btn">enter</button>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────────────── -->
  <div id="dashboard">

    <!-- ── Main tab switcher ──────────────────────────────────────────── -->
    <div class="main-tabs">
      <button class="logout-btn" id="logout-btn" title="Sign out">logout</button>
      <button class="main-tab active" id="tab-students" data-action="switchTab" data-args="students">students</button>
      <button class="main-tab" id="tab-courses" data-action="switchTab" data-args="courses">courses</button>
      <button class="main-tab" id="tab-teachers" data-action="switchTab" data-args="teachers">teachers</button>
      <button class="main-tab" id="tab-invoices" data-action="switchTab" data-args="invoices">invoices</button>
    </div>

    <div id="panel-students" class="is-hidden"></div>
    <div id="panel-courses" class="is-hidden"></div>
    <div id="panel-teachers" class="is-hidden"></div>
    <div id="panel-invoices" class="is-hidden"></div>

  </div>

  <!-- ── Confirm send modal (shared across all tabs) ────────────────── -->
  <div class="modal-overlay" id="confirm-send-modal">
    <div class="modal">
      <h2 id="cs-title">confirm send</h2>
      <div class="modal-field">
        <label>Recipients <span id="cs-recipients-count" class="cs-meta"></span></label>
        <ul id="cs-recipients" class="cs-recipients"></ul>
      </div>
      <div class="modal-field" id="cs-language-field" hidden>
        <label>Language</label>
        <div class="cert-radio-row">
          <label class="cert-radio">
            <input type="radio" name="cs-language" value="de" checked> Deutsch
          </label>
          <label class="cert-radio">
            <input type="radio" name="cs-language" value="en"> English
          </label>
        </div>
      </div>
      <div class="modal-field">
        <label>Subject</label>
        <p id="cs-subject" class="cs-subject"></p>
      </div>
      <div class="modal-field">
        <label>Email contents</label>
        <div id="cs-content" class="cs-content"></div>
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" data-action="closeConfirmSendModal">cancel</button>
        <button class="modal-submit" id="cs-submit" data-action="submitConfirmSend">send</button>
      </div>
      <p class="modal-msg" id="cs-msg"></p>
    </div>
  </div>

  <script type="module" src="/admin/main.js?v=cert-cache-20260601"></script>
</body>
</html>
