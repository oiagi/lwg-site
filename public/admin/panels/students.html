<div class="dashboard-header students-header">
  <div class="course-filter-row">
    <button class="filter-btn active" data-student-status="active" data-action="filterStudents" data-args="active">active</button>
    <button class="filter-btn" data-student-status="all" data-action="filterStudents" data-args="all">all</button>
    <button class="filter-btn" data-student-status="inactive" data-action="filterStudents" data-args="inactive">inactive</button>
  </div>
  <div class="students-header-actions">
    <button class="secondary-btn" id="students-export-btn" data-action="exportStudents">export xlsx</button>
    <button class="secondary-btn" data-action="openImportModal">import xlsx</button>
    <a class="new-course-btn" href="/admin/pages/student-form.html">+ new student</a>
  </div>
</div>
<div class="list-toolbar" aria-label="Student list tools">
  <input type="search" id="student-search" class="list-search" placeholder="Search students…" autocomplete="off">
  <div class="list-sort-controls">
    <label for="student-sort">Sort</label>
    <select id="student-sort" class="list-sort">
      <option value="name">Name</option>
      <option value="created_at">Created date</option>
      <option value="status">Status</option>
      <option value="customer_reference">Reference</option>
      <option value="course_count">Courses</option>
    </select>
    <button type="button" id="student-sort-dir" class="sort-dir-btn" aria-label="Sort ascending" data-dir="asc">↑</button>
  </div>
</div>
<div class="students-layout">
  <div class="students-sidebar">
    <div id="student-list" role="listbox" aria-label="Students">
      <div class="loading-state">loading…</div>
    </div>
  </div>
  <div class="student-detail-pane">
    <div id="student-detail-panel" class="student-detail-empty">
      <p>select a student to view their details</p>
    </div>
  </div>
</div>

<!-- ── Import students modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h2>import students</h2>
    <p class="label-hint" style="margin-bottom:0.8rem;">
      Upload an .xlsx file with column headers matching student fields
      (first_name, last_name, email, phone, status, …). Rows with a
      matching email are updated; the rest are created as new students.
    </p>
    <div class="modal-field">
      <label>Excel file</label>
      <input type="file" id="import-file" accept=".xlsx,.xls,.csv" data-action-change="handleImportFile">
    </div>
    <div id="import-preview" style="margin-top:0.8rem;"></div>
    <div class="modal-actions">
      <button class="modal-cancel" data-action="closeImportModal">cancel</button>
      <button class="modal-submit" id="import-submit" data-action="submitImport" disabled>import</button>
    </div>
    <p class="modal-msg" id="import-msg"></p>
  </div>
</div>

<!-- ── Enroll student in course modal ────────────────────────────────── -->
<div class="modal-overlay" id="enroll-student-modal">
  <div class="modal">
    <h2>enroll in course</h2>
    <div class="modal-field">
      <label>Course</label>
      <select id="es-course">
        <option value="">loading courses…</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" data-action="closeEnrollStudentModal">cancel</button>
      <button class="modal-submit" id="es-submit" data-action="submitEnrollStudent" disabled>enroll</button>
    </div>
    <p class="modal-msg" id="es-msg"></p>
  </div>
</div>
