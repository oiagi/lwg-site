<div class="dashboard-header students-header">
  <div class="course-filter-row" id="archive-year-filters">
    <!-- Year filter buttons injected by JS -->
  </div>
  <!-- Both exports always cover the whole selected year, never the current
       status filter or search — the labels name the year to make that plain. -->
  <div class="students-header-actions">
    <button class="secondary-btn" id="invoice-zip-btn" data-action="downloadInvoicePdfZip" disabled>download PDFs (zip)</button>
    <button class="secondary-btn" id="invoice-xlsx-btn" data-action="exportInvoiceXlsx" disabled>export Excel</button>
  </div>
</div>
<div class="invoice-status-filters">
  <span class="invoice-filter-label">show</span>
  <div class="course-filter-row" id="archive-status-filters">
    <!-- Status filter buttons injected by JS (labels carry live counts) -->
  </div>
</div>
<div class="list-toolbar" aria-label="Invoice list tools">
  <input type="search" id="invoice-search" class="list-search" placeholder="Search invoice number, student or course…" autocomplete="off">
  <span class="detail-muted" id="archive-count"></span>
  <span class="detail-muted" id="invoice-export-status" aria-live="polite"></span>
</div>
<div id="archive-list">
  <div class="loading-state">loading…</div>
</div>

<!-- ── Storno (cancel invoice) modal ─────────────────────────────────── -->
<div class="modal-overlay" id="storno-modal">
  <div class="modal modal-wide">
    <h2 id="storno-title">cancel invoice</h2>

    <p class="label-hint storno-warning is-hidden" id="storno-warning"></p>

    <div class="modal-grid">
      <div class="modal-field">
        <label for="storno-number">Storno invoice number</label>
        <input type="text" id="storno-number">
      </div>
      <div class="modal-field">
        <label for="storno-date">Storno date</label>
        <input type="date" id="storno-date">
      </div>
      <div class="modal-field full">
        <label for="storno-subject">Subject</label>
        <input type="text" id="storno-subject">
      </div>
      <div class="modal-field">
        <label for="storno-quantity">Number of lessons</label>
        <input type="number" id="storno-quantity" min="0" step="1">
      </div>
      <div class="modal-field">
        <label for="storno-unit-price">Price per lesson CHF</label>
        <input type="number" id="storno-unit-price" min="0" step="0.05">
      </div>
      <div class="modal-field">
        <label for="storno-total">Storno total CHF</label>
        <input type="number" id="storno-total" readonly>
      </div>
    </div>

    <div class="modal-field cert-options">
      <div>
        <label class="cert-radio">
          <input type="checkbox" id="storno-notify"> notify student by email
        </label>
        <p class="label-hint is-hidden" id="storno-notify-hint">
          This invoice has no student email on record — only the document can be generated.
        </p>
      </div>
      <div id="storno-language-row" class="is-hidden">
        <label class="cert-radio">
          <input type="checkbox" id="storno-followup" checked> mention that a new invoice follows
        </label>
        <label>Language</label>
        <div class="cert-radio-row">
          <label class="cert-radio">
            <input type="radio" name="storno-language" value="de" checked> Deutsch
          </label>
          <label class="cert-radio">
            <input type="radio" name="storno-language" value="en"> English
          </label>
        </div>
      </div>
    </div>

    <div class="modal-field">
      <label>Preview</label>
      <div id="storno-preview" class="invoice-preview"></div>
    </div>

    <div class="modal-actions">
      <button class="modal-cancel" data-action="closeStornoModal">cancel</button>
      <button class="modal-submit" id="storno-submit" data-action="submitStorno">cancel invoice</button>
    </div>
    <p class="modal-msg" id="storno-msg"></p>
  </div>
</div>
