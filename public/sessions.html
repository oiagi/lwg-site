<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sessions — learning with gioia</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="sessions.css">
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="/js/device-detect.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">skip to content</a>

  <div class="container" id="main">
    <div class="error-state">loading…</div>
  </div>

  <script src="/js/nav.js"></script>
  <script>
    /* ── Student sessions page ───────────────────────────────────────────
       Reads the access token from the URL (?token=...) and fetches
       the student's session data from the API. No login required —
       the token acts as the credential.                               */

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('de-CH', {
        weekday: 'short', day: '2-digit', month: '2-digit',
        year: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    async function load() {
      const token   = new URLSearchParams(window.location.search).get('token');
      const content = document.getElementById('main');

      if (!token) {
        content.innerHTML = '<div class="error-state">No session link provided.<br>Please use the link sent to you by your teacher.</div>';
        return;
      }

      try {
        const res  = await fetch('/api/student-sessions?token=' + encodeURIComponent(token));
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (!data.courses || !data.courses.length) {
          content.innerHTML = `<h1>your sessions</h1>
  <div class="empty-state">
    <p>No sessions scheduled yet.</p>
    <a class="book-link" href="/enquiry.html">make an enquiry →</a>
  </div>`;
          return;
        }

        const name = [data.student.firstName, data.student.lastName].filter(Boolean).join(' ');
        const level = data.student.level ? ` · ${data.student.level}` : '';

        let html = `<h1>your sessions</h1><p class="subtitle">${name}${level}</p>`;

        data.courses.forEach(course => {
          const total     = course.sessions_total;
          const completed = course.sessions_completed || 0;
          const remaining = total ? total - completed : null;
          const pct       = total ? Math.min(100, Math.round(completed / total * 100)) : 0;

          const countLine = total
            ? `${completed} of ${total} sessions completed · ${remaining} remaining`
            : `${completed} sessions completed`;

          const rebookNote = total && remaining <= 3 && remaining > 0
            ? `<p class="rebook-note">You have ${remaining} session${remaining === 1 ? '' : 's'} remaining. Ready to continue? <a href="/enquiry.html">Make a new enquiry →</a></p>`
            : total && remaining === 0
            ? `<p class="rebook-note">Your current block is complete. <a href="/enquiry.html">Book your next block →</a></p>`
            : '';

          const sessionRows = course.sessions.map(s => `
            <div class="session-row">
              <div class="session-dot ${s.status}"></div>
              <div class="session-date">${fmtDate(s.scheduled_at)}</div>
              <div class="session-label">${s.status}</div>
            </div>
          `).join('');

          html += `
            <div class="course-block">
              <p class="course-code">${course.course_code} · ${course.service || ''} ${course.level ? '· ' + course.level : ''}</p>
              <p class="session-count">${countLine}</p>
              ${total ? `<div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>` : ''}
              ${sessionRows || '<p style="font-size:0.82rem;color:#aaa;">No sessions scheduled yet.</p>'}
              ${rebookNote}
            </div>`;
        });

        content.innerHTML = html;
      } catch {
        content.innerHTML = '<div class="error-state">Could not load your sessions.<br>Please check your link or contact your teacher.</div>';
      }
    }

    load();
  </script>

</body>
</html>
