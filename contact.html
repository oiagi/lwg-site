<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Learning with Gioia</title>
  <meta name="description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="robots" content="index, follow">
  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="learning with gioia">
  <meta property="og:title"       content="Contact — Learning with Gioia">
  <meta property="og:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta property="og:url"         content="https://oiagi.org/contact.html">
  <meta property="og:image"       content="https://oiagi.org/gioia_logo.png">
  <!-- Twitter/X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Contact — Learning with Gioia">
  <meta name="twitter:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="twitter:image"       content="https://oiagi.org/gioia_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      --page-bg: #d6eaf8;           /* used by nav gradient to match page bg */
      background-color: #d6eaf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1rem 4rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      transition: background-color 0.6s ease;
    }
    /* Background turns slightly deeper blue when nav is open */
    body.nav-active { --page-bg: #b8d9f0; background-color: #b8d9f0; }

    /* ── Fade-up entry animation ────────────────────────────────── */

    


    /* ── Form container ─────────────────────────────────────────── */
    .form-container {
      width: min(90vw, 420px);
      margin-top: 1rem;
      animation: fadeUp 0.6s ease both;
    }

    /* ── Page heading ───────────────────────────────────────────── */
    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #1a1a1a;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ── Form field wrapper ─────────────────────────────────────── */
    .field { margin-bottom: 1.4rem; }

    /* ── Field labels ───────────────────────────────────────────── */
    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 0.4rem;
    }

    /* ── Text inputs and textarea ───────────────────────────────── */
    input, textarea, select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #1a1a1a;
      padding: 0.4rem 0;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 300;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea { resize: none; height: 80px; }
    select { cursor: pointer; appearance: none; -webkit-appearance: none; }

    /* ── Submit button ──────────────────────────────────────────── */
    button[type="submit"] {
      margin-top: 2rem;
      display: block;
      width: 100%;
      background: #1a1a1a;
      color: #d6eaf8;
      border: none;
      padding: 0.9rem;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button[type="submit"]:hover { background: #ffffff; color: #1a1a1a; }

    @media (max-width: 500px) {
      h1 { font-size: 1.6rem; margin-bottom: 1.8rem; }
      input, textarea, select { font-size: 0.9rem; }
      button[type="submit"] { padding: 0.8rem; font-size: 0.75rem; }
    }

    html[data-device="mobile"] h1        { font-size: 1.55rem; margin-bottom: 1.6rem; }
    html[data-device="mobile"] .form-container { width: 94vw; }
    html[data-device="mobile"] button[type="submit"] { padding: 0.85rem; font-size: 0.78rem; min-height: 48px; }
    html[data-device="tablet"] h1        { font-size: 1.8rem; }
    html[data-device="tablet"] .form-container { width: min(80vw, 460px); }
    html[data-device="tablet"] button[type="submit"] { min-height: 48px; }
  </style>

  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>


  <!-- ── Contact form ───────────────────────────────────────────────
       Submits to Web3Forms which forwards the message to info@oiagi.org.
       On success, redirects to thankyou.html. -->
  <div class="form-container">
    <h1>get in touch :)</h1>
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="f211dfaf-e24d-45cc-b992-3b2e0d56ddd9" />
      <input type="hidden" name="redirect" value="https://oiagi.org/thankyou.html" />
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="phone">phone</label>
        <input type="tel" id="phone" name="phone" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="preferred-contact">preferred contact method</label>
        <select id="preferred-contact" name="preferred_contact" required>
          <option value="" disabled selected></option>
          <option value="Email">Email</option>
          <option value="Phone">Phone</option>
          <option value="Either">Either</option>
        </select>
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">send</button>
    </form>
  </div>

  
  <script src="nav.js"></script>


</body>
</html>
