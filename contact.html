<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Learning with Gioia</title>
  <meta name="description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://oiagi.org/contact.html">
  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="learning with gioia">
  <meta property="og:title"       content="Contact — Learning with Gioia">
  <meta property="og:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta property="og:url"         content="https://oiagi.org/contact.html">
  <meta property="og:image"       content="https://oiagi.org/gioia_logo.png">
  <!-- Twitter/X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Contact — Learning with Gioia">
  <meta name="twitter:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="twitter:image"       content="https://oiagi.org/gioia_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact.css">

  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>


  <!-- ── Contact form ───────────────────────────────────────────────
       Submits via JS to /api/submit-contact (sends via Resend).
       On success, redirects to thankyou.html. -->
  <div class="form-container">
    <h1>get in touch :)</h1>
    <form id="contact-form">
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="phone">phone</label>
        <input type="tel" id="phone" name="phone" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="preferred-contact">preferred contact method</label>
        <select id="preferred-contact" name="preferred_contact" required>
          <option value="" disabled selected></option>
          <option value="Email">Email</option>
          <option value="Phone">Phone</option>
          <option value="Either">Either</option>
        </select>
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required maxlength="500"></textarea>
        <span class="char-counter"><span id="char-count">0</span>/500</span>
      </div>
      <button type="submit">send</button>
      <p id="form-error" style="display:none;color:#c0392b;font-size:0.78rem;margin-top:0.8rem;text-align:center;"></p>
    </form>
  </div>


  <script src="nav.js"></script>
  <script>
  (function () {
    var form  = document.getElementById('contact-form');
    var btn   = form.querySelector('button[type="submit"]');
    var errEl = document.getElementById('form-error');

    /* ── Character counter ── */
    var ta = document.getElementById('message');
    var cc = document.getElementById('char-count');
    cc.textContent = ta.value.length;
    ta.addEventListener('input', function () { cc.textContent = ta.value.length; });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.dataset.loading = '';
      btn.disabled = true;

      try {
        var res = await fetch('/api/submit-contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name:              form.querySelector('#name').value,
            email:             form.querySelector('#email').value,
            phone:             form.querySelector('#phone').value,
            preferred_contact: form.querySelector('#preferred-contact').value,
            message:           form.querySelector('#message').value,
          }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Could not send message');
        window.location.href = 'thankyou.html';
      } catch (err) {
        errEl.textContent = err.message || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        delete btn.dataset.loading;
        btn.disabled = false;
      }
    });
  })();
  </script>


</body>
</html>
