<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Learning with Gioia</title>
  <meta name="description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="robots" content="index, follow">
  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="learning with gioia">
  <meta property="og:title"       content="Contact — Learning with Gioia">
  <meta property="og:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta property="og:url"         content="https://oiagi.org/contact.html">
  <meta property="og:image"       content="https://oiagi.org/gioia_logo.png">
  <!-- Twitter/X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Contact — Learning with Gioia">
  <meta name="twitter:description" content="Get in touch with Learning with Gioia. We offer language courses, exam preparation and tutoring in Zürich.">
  <meta name="twitter:image"       content="https://oiagi.org/gioia_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact.css">

  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>


  <!-- ── Contact form ───────────────────────────────────────────────
       Submits to Web3Forms which forwards the message to info@oiagi.org.
       On success, redirects to thankyou.html. -->
  <div class="form-container">
    <h1>get in touch :)</h1>
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="f211dfaf-e24d-45cc-b992-3b2e0d56ddd9" />
      <input type="hidden" name="redirect" value="https://oiagi.org/thankyou.html" />
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="phone">phone</label>
        <input type="tel" id="phone" name="phone" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="preferred-contact">preferred contact method</label>
        <select id="preferred-contact" name="preferred_contact" required>
          <option value="" disabled selected></option>
          <option value="Email">Email</option>
          <option value="Phone">Phone</option>
          <option value="Either">Either</option>
        </select>
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">send</button>
    </form>
  </div>


  <script src="nav.js"></script>


</body>
</html>
