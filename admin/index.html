<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/device-detect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div id="login-screen" style="display:none;">
    <h1>admin</h1>
    <div class="field">
      <label for="admin-email">email</label>
      <input type="email" id="admin-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="admin-pwd">password</label>
      <input type="password" id="admin-pwd" autocomplete="current-password" />
      <div class="error-msg" id="pwd-error">Invalid email or password.</div>
    </div>
    <button class="submit" id="login-btn">enter</button>
  </div>

  <script type="module" src="/admin/login-page.js"></script>
</body>
</html>
