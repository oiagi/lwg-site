<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — edit course</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/device-detect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div id="page-loading" class="page-form-shell">
    <p class="loading-state">loading…</p>
  </div>

  <main id="page-content" class="page-form-shell" style="display:none;">
    <a href="/admin.html#courses" class="page-form-back">← back to courses</a>
    <h1>edit course</h1>
    <p class="label-hint" id="ec-code-label" style="margin-bottom:1rem;"></p>

    <form id="course-edit-form" novalidate>
      <input type="hidden" id="ec-id" value="">

      <div class="modal-grid">
        <div class="modal-field">
          <label>Subject</label>
          <select id="ec-service">
            <option value="language course">Language course</option>
            <option value="exam preparation">Exam preparation</option>
            <option value="tutoring">Tutoring</option>
            <option value="gymivorbereitung">Gymivorbereitung</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Course level</label>
          <select id="ec-level">
            <option value="">—</option>
            <option>A1</option><option>A2</option><option>B1</option>
            <option>B2</option><option>C1</option><option>C2</option>
            <option value="CH">CH (Swiss German)</option>
            <option value="SUB">SUB (Tutoring)</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Group size</label>
          <select id="ec-group">
            <option value="private">Private (1)</option>
            <option value="duo">Duo (2)</option>
            <option value="group">Group (3+)</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Status</label>
          <select id="ec-status">
            <option value="active">active</option>
            <option value="paused">paused</option>
            <option value="completed">completed</option>
            <option value="cancelled">cancelled</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Number of sessions <span class="label-hint">(blank = open-ended)</span></label>
          <input type="number" id="ec-sessions" min="1" placeholder="e.g. 30">
        </div>
        <div class="modal-field">
          <label>Session length (min)</label>
          <input type="number" id="ec-session-length" min="15" step="5" placeholder="50">
        </div>
        <div class="modal-field">
          <label>Price per session</label>
          <input type="number" id="ec-price" min="0" step="0.01" placeholder="e.g. 80">
        </div>
        <div class="modal-field">
          <label>Currency</label>
          <select id="ec-currency">
            <option value="CHF">CHF</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Location</label>
          <select id="ec-location">
            <option value="">—</option>
            <option value="online">Online</option>
            <option value="teacher's home">Teacher's home</option>
            <option value="student's home">Student's home</option>
            <option value="company">Company</option>
            <option value="classroom">Classroom</option>
          </select>
        </div>
        <div class="modal-field full">
          <p class="modal-section-label" style="margin:0 0 0.8rem;">Course location address <span class="label-hint">(optional — appears on certificate of attendance)</span></p>
          <div class="modal-grid">
            <div class="modal-field">
              <label>Street</label>
              <input type="text" id="ec-loc-street" placeholder="e.g. Bahnhofstrasse" maxlength="100">
            </div>
            <div class="modal-field">
              <label>Street number</label>
              <input type="text" id="ec-loc-number" placeholder="e.g. 12a" maxlength="20">
            </div>
            <div class="modal-field">
              <label>Postal code</label>
              <input type="text" id="ec-loc-postal" placeholder="e.g. 8001" maxlength="20">
            </div>
            <div class="modal-field">
              <label>City</label>
              <input type="text" id="ec-loc-city" placeholder="e.g. Zürich" maxlength="80">
            </div>
          </div>
        </div>
      </div>

      <div class="page-form-actions">
        <a href="/admin.html#courses" class="modal-cancel">cancel</a>
        <button type="submit" class="modal-submit" id="ec-submit">save changes</button>
      </div>
      <p class="modal-msg" id="ec-msg"></p>
    </form>
  </main>

  <script type="module" src="/admin/course-edit.js"></script>
</body>
</html>
