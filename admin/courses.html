<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — courses</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/device-detect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────── -->
  <div id="login-screen">
    <h1>admin</h1>
    <div class="field">
      <label for="admin-email">email</label>
      <input type="email" id="admin-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="admin-pwd">password</label>
      <input type="password" id="admin-pwd" autocomplete="current-password" />
      <div class="error-msg" id="pwd-error">Invalid email or password.</div>
    </div>
    <button class="submit" id="login-btn">enter</button>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────────────── -->
  <div id="dashboard">

    <div class="main-tabs">
      <button class="logout-btn" id="logout-btn" title="Sign out">logout</button>
      <a class="main-tab" href="/admin/students">students</a>
      <a class="main-tab active" href="/admin/courses">courses</a>
      <a class="main-tab" href="/admin/teachers">teachers</a>
    </div>

    <div id="panel-courses">
      <div class="dashboard-header students-header">
        <div class="course-filter-row">
          <button class="filter-btn active" data-course-status="active" data-action="filterCourses" data-args="active">active</button>
          <button class="filter-btn" data-course-status="all" data-action="filterCourses" data-args="all">all</button>
          <button class="filter-btn" data-course-status="completed" data-action="filterCourses" data-args="completed">completed</button>
          <button class="filter-btn" data-course-status="cancelled" data-action="filterCourses" data-args="cancelled">cancelled</button>
        </div>
        <a class="new-course-btn" href="/admin/course-new.html">+ new course</a>
      </div>
      <div id="course-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Add participant modal ─────────────────────────────────────── -->
    <div class="modal-overlay" id="add-participant-modal">
      <div class="modal">
        <h2>add participant</h2>
        <input type="hidden" id="ap-selected-id">
        <div class="modal-field modal-field--relative">
          <label>Search existing student</label>
          <input type="text" id="ap-search" placeholder="Name or email…" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="ap-dropdown">
          <ul id="ap-dropdown" class="search-dropdown" role="listbox" style="display:none;"></ul>
        </div>
        <p class="modal-section-label" style="margin-top:1rem;margin-bottom:0.5rem;">or enter manually</p>
        <div class="modal-grid">
          <div class="modal-field"><label>First name</label><input type="text" id="ap-first"></div>
          <div class="modal-field"><label>Last name</label><input type="text" id="ap-last"></div>
          <div class="modal-field"><label>Email</label><input type="email" id="ap-email"></div>
          <div class="modal-field"><label>Phone</label><input type="tel" id="ap-phone"></div>
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeAddParticipantModal">cancel</button>
          <button class="modal-submit" id="ap-submit" data-action="submitAddParticipant">add</button>
        </div>
        <p class="modal-msg" id="ap-msg"></p>
      </div>
    </div>

    <!-- ── Confirm send modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="confirm-send-modal">
      <div class="modal">
        <h2 id="cs-title">confirm send</h2>
        <div class="modal-field">
          <label>Recipients <span id="cs-recipients-count" class="cs-meta"></span></label>
          <ul id="cs-recipients" class="cs-recipients"></ul>
        </div>
        <div class="modal-field">
          <label>Subject</label>
          <p id="cs-subject" class="cs-subject"></p>
        </div>
        <div class="modal-field">
          <label>Email contents</label>
          <div id="cs-content" class="cs-content"></div>
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeConfirmSendModal">cancel</button>
          <button class="modal-submit" id="cs-submit" data-action="submitConfirmSend">send</button>
        </div>
        <p class="modal-msg" id="cs-msg"></p>
      </div>
    </div>

    <!-- ── Certificates modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="certificates-modal">
      <div class="modal modal-wide">
        <h2 id="cert-title">send certificates of attendance</h2>
        <input type="hidden" id="cert-course-id" value="">

        <div class="modal-field">
          <label>Recipients <span class="cs-meta" id="cert-count"></span></label>
          <div id="cert-students" class="cert-students"></div>
        </div>

        <div class="modal-field cert-options">
          <div>
            <label>Language</label>
            <div class="cert-radio-row">
              <label class="cert-radio">
                <input type="radio" name="cert-language" value="de" checked> Deutsch
              </label>
              <label class="cert-radio">
                <input type="radio" name="cert-language" value="en"> English
              </label>
            </div>
          </div>
          <div>
            <label>Attendance details</label>
            <label class="checkbox-label">
              <input type="checkbox" id="cert-include-attendance">
              Include "X of Y sessions attended"
            </label>
          </div>
        </div>

        <div class="modal-field">
          <label>Preview</label>
          <div id="cert-preview" class="cert-preview"></div>
          <p class="label-hint" style="margin-top:0.4rem;">
            Each certificate has a unique ID and will be sent as a PDF attachment.
          </p>
        </div>

        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeCertificateModal">cancel</button>
          <button class="modal-submit" id="cert-submit" data-action="submitCertificates">send certificates</button>
        </div>
        <p class="modal-msg" id="cert-msg"></p>
      </div>
    </div>

    <!-- ── Attendance modal ──────────────────────────────────────────── -->
    <div class="modal-overlay" id="attendance-modal">
      <div class="modal">
        <h2 id="att-title">mark attendance</h2>
        <input type="hidden" id="att-session-id" value="">
        <input type="hidden" id="att-course-id" value="">
        <div id="att-students"></div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeAttendanceModal">cancel</button>
          <button class="modal-submit" id="att-submit" data-action="submitAttendance">save attendance</button>
        </div>
        <p class="modal-msg" id="att-msg"></p>
      </div>
    </div>

  </div>

  <script type="module" src="/admin/courses-page.js"></script>
</body>
</html>
