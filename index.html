<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning with Gioia — Language Courses & Tutoring in Zürich</title>
  <meta name="description" content="Language courses, exam preparation and tutoring in Zürich. Native-speaking teachers with linguistics degrees and formal teaching qualifications.">
  <meta name="robots" content="index, follow">
  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="learning with gioia">
  <meta property="og:title"       content="Learning with Gioia — Language Courses & Tutoring in Zürich">
  <meta property="og:description" content="Language courses, exam preparation and tutoring in Zürich. Native-speaking teachers with linguistics degrees and formal teaching qualifications.">
  <meta property="og:url"         content="https://oiagi.org/">
  <meta property="og:image"       content="https://oiagi.org/gioia_logo.png">
  <!-- Twitter/X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Learning with Gioia — Language Courses & Tutoring in Zürich">
  <meta name="twitter:description" content="Language courses, exam preparation and tutoring in Zürich. Native-speaking teachers with linguistics degrees and formal teaching qualifications.">
  <meta name="twitter:image"       content="https://oiagi.org/gioia_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
  <script src="device-detect.js"></script>
</head>
<body>

  <!-- ── Logo — clicking opens the nav ─────────────────────────────── -->
  <div class="logo-wrap" id="logo-wrap" role="button" aria-label="Open navigation">
    <img class="logo-img" src="lwg_logo.png" alt="learning with Gioia" />
    <span class="logo-hint">click anywhere to navigate</span>
  </div>

  <!-- ── Blurb ──────────────────────────────────────────────────────── -->
  <div class="blurb">
    <p>Small groups. Carefully prepared,<br>individually tailored lessons.</p>
    <span class="divider"></span>
    <p>We give you the tools to use the language<br>beyond the classroom —<br>and the motivation to actually want to.</p>
  </div>

  <script src="nav.js"></script>
  <script>
    /* ── Click anywhere on page opens nav ──────────────────────────── */
    document.body.addEventListener('click', function (e) {
      if (!window.__navIsOpen()) {
        e.stopPropagation();
        window.__navToggle(e.clientX, e.clientY);
      }
    });

    /* nav-menu clicks should navigate, not re-trigger body click */
    document.getElementById('nav-menu').addEventListener('click', function (e) {
      e.stopPropagation();
    });

    /* ── Cursor-following tooltip ───────────────────────────────────── */
    var logoWrap = document.getElementById('logo-wrap');
    var hint     = logoWrap.querySelector('.logo-hint');

    if (document.documentElement.getAttribute('data-touch') !== 'true') {
      logoWrap.addEventListener('mouseenter', function () { hint.classList.add('visible'); });
      logoWrap.addEventListener('mouseleave', function () { hint.classList.remove('visible'); });
      logoWrap.addEventListener('mousemove', function (e) {
        hint.style.left = e.clientX + 'px';
        hint.style.top  = e.clientY + 'px';
      });
    }
  </script>

</body>
</html>
