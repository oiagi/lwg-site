  <style>
    
    /* ── Base reset ─────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      --page-bg: #ffffff;           /* used by nav gradient to match page bg */
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      transition: background-color 0.6s ease;
    }
    /* Background turns blue when nav menu is open */
    body.nav-active { --page-bg: #d6eaf8; background-color: #d6eaf8; }
    
    /* ── Navigation cloud (replaces burger menu) ──────────────────
       Fixed to top-left. Clicking opens book/contact links and
       turns the page blue. Clicking again or elsewhere closes it. */
    /* ── Navigation cloud ──────────────────────────────────────────
       Fixed to top-left corner. Hidden when user scrolls down,
       reappears when scrolled back to the top of the page.
       No background strip — clean and non-overlapping. */
        .nav {
      position: fixed;
      top: clamp(0.8rem, 3.5vw, 1.8rem);
      left: clamp(0.8rem, 4.5vw, 2.2rem);
      z-index: 100;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    /* Hidden state applied by JS when scrolled down */
    .nav.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .nav-cloud {
      width: clamp(1.4rem, 4vw, 3.6rem);
      height: clamp(0.7rem, 2vw, 1.8rem);
      object-fit: contain;
      cursor: pointer;
      display: block;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .nav-cloud:hover { opacity: 1; }
    /* ── Nav menu links ─────────────────────────────────────────────
       Shown below the cloud when menu is open.
       Centred under the cloud using text-align and width match. */
    .nav-menu {
      display: none;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.8rem;
      width: clamp(1.4rem, 4vw, 3.6rem);        /* match cloud width so links centre under it */
      align-items: center; /* centre links horizontally */
    }
    .nav-menu.open {
      display: flex;
      animation: fadeUp 0.25s ease both;
    }
    .nav-menu a {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1a1a1a;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .nav-menu a:hover { opacity: 0.4; }

    
    /* ── Ripple animation ────────────────────────────────────────────
       Expanding circle that plays on nav cloud click */
    .ripple {
      position: fixed;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(100, 180, 230, 0.3);
      animation: ripple-anim 0.6s linear forwards;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(5); opacity: 0; } }


    @media (max-width: 500px) {
      h1 { font-size: 1.6rem; margin-bottom: 1.8rem; }
    }

    /* ═══════════════════════════════════════════════════════════════════
       DEVICE-AWARE STYLES
       html[data-device="mobile"]  — phones (< 600px short side, coarse ptr)
       html[data-device="tablet"]  — tablets (≥ 600px short side, coarse ptr)
       html[data-device="desktop"] — mouse + keyboard devices
       ═══════════════════════════════════════════════════════════════════ */

    /* ── Desktop: restore hover effects (already present as default) ── */
    html[data-device="desktop"] .nav-cloud:hover { opacity: 1; }
    html[data-device="desktop"] .nav-menu a:hover { opacity: 0.4; }

    /* ── Touch devices: remove all :hover effects, use :active instead ─ */
    html[data-touch="true"] .nav-cloud:hover { opacity: 0.6; }
    html[data-touch="true"] .nav-cloud:active { opacity: 1; }
    html[data-touch="true"] .nav-menu a:hover { opacity: 1; }
    html[data-touch="true"] .nav-menu a:active { opacity: 0.4; }

    /* ── Mobile (phone): compact nav, larger touch targets ────────────── */
    html[data-device="mobile"] .nav {
      top: 0.9rem;
      left: 1rem;
    }
    html[data-device="mobile"] .nav-cloud {
      width: 1.6rem;
      height: 0.8rem;
    }
    html[data-device="mobile"] .nav-menu {
      width: auto;
      gap: 1rem;
      align-items: flex-start;
    }
    html[data-device="mobile"] .nav-menu a {
      font-size: 0.82rem;
      padding: 0.2rem 0;
    }

    /* ── Tablet: slightly larger nav, generous tap targets ─────────── */
    html[data-device="tablet"] .nav {
      top: 1.1rem;
      left: 1.4rem;
    }
    html[data-device="tablet"] .nav-cloud {
      width: 1.75rem;
      height: 0.88rem;
    }
    html[data-device="tablet"] .nav-menu {
      width: 1.75rem;
      gap: 0.9rem;
    }
    html[data-device="tablet"] .nav-menu a {
      font-size: 0.78rem;
      padding: 0.15rem 0;
    }

    /* ── Desktop: standard nav sizing ─────────────────────────────── */
    html[data-device="desktop"] .nav-cloud {
      width: 3.6rem;
      height: 1.8rem;
    }
    html[data-device="desktop"] .nav-menu {
      width: 3.6rem;
    }
    html[data-device="desktop"] .nav-menu a {
      font-size: 0.75rem;
    }

    html[data-device="mobile"] body { padding: 0; }
    html[data-device="tablet"] body { padding: 0; }
  

    /* ── Landing page layout ─────────────────────────────────────────── */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 5rem 1.5rem 4rem;
      gap: 0;
    }

    /* ── Logo ────────────────────────────────────────────────────────── */
    .logo-wrap {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin-bottom: 3rem;
      animation: fadeUp 0.8s ease both;
    }
    .logo-img {
      width: min(72vw, 480px);
      height: auto;
      display: block;
      opacity: 0.92;
      transition: opacity 0.2s;
    }
    .logo-wrap:hover .logo-img { opacity: 1; }

    /* ── Nav hint tooltip — follows cursor ──────────────────────────── */
    .logo-hint {
      position: fixed;
      white-space: nowrap;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
      background: rgba(255,255,255,0.92);
      padding: 0.3rem 0.7rem;
      border: 1px solid #ddd;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: 999;
      transform: translate(16px, -50%);
    }
    .logo-hint.visible { opacity: 1; }

    /* ── Blurb ───────────────────────────────────────────────────────── */
    .blurb {
      text-align: center;
      max-width: 420px;
      animation: fadeUp 0.9s ease 0.15s both;
    }
    .blurb p {
      font-size: 1rem;
      line-height: 2;
      font-weight: 300;
      color: #1a1a1a;
      letter-spacing: 0.03em;
    }
    .blurb .divider {
      display: block;
      width: 1px;
      height: 1.2rem;
      background: #ccc;
      margin: 0.4rem auto;
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    html[data-device="mobile"] body  { padding: 4.5rem 1rem 3rem; }
    html[data-device="mobile"] .logo-img { width: min(88vw, 340px); }
    html[data-device="mobile"] .blurb p  { font-size: 0.95rem; line-height: 1.9; }
    html[data-touch="true"] .logo-hint { display: none; }
  </style>
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script>
    (function () {
      var ua   = navigator.userAgent;
      var w    = window.screen.width;
      var h    = window.screen.height;
      var short = Math.min(w, h);
      var long  = Math.max(w, h);

      // Pointer capability: "fine" = mouse, "coarse" = touch
      var hasCoarse  = window.matchMedia('(pointer: coarse)').matches;
      var hasHover   = window.matchMedia('(hover: hover)').matches;

      // UA hints for phones and tablets
      var uaPhone  = /iPhone|Android.*Mobile|Windows Phone|BlackBerry/i.test(ua);
      var uaTablet = /iPad|Android(?!.*Mobile)|Tablet/i.test(ua);

      var device;
      if (uaPhone || (hasCoarse && !hasHover && short < 600)) {
        device = 'mobile';
      } else if (uaTablet || (hasCoarse && !hasHover && short >= 600)) {
        device = 'tablet';
      } else {
        device = 'desktop';
      }

      document.documentElement.setAttribute('data-device', device);
      // Also flag touch so JS can guard hover-only interactions
      if (hasCoarse) {
        document.documentElement.setAttribute('data-touch', 'true');
      }
    })();
  </script>

  <!-- ── Blurb ─────────────────────────────────────────────────────────── -->
  <div class="blurb">
    <p>Small groups. Carefully prepared,<br>individually tailored lessons.</p>
    <span class="divider"></span>
    <p>We give you the tools to use the language<br>beyond the classroom —<br>and the motivation to actually want to.</p>
  </div>

  <script>
    const navCloud = document.getElementById('nav-cloud');
    const navMenu  = document.getElementById('nav-menu');
    const nav      = document.getElementById('nav');
    let menuOpen   = false;

    /* Hide/show nav based on scroll position */
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) {
        nav.classList.add('hidden');
        /* Also close menu if open when scrolling away */
        if (menuOpen) {
          menuOpen = false;
          navMenu.classList.remove('open');
          document.body.classList.remove('nav-active');
        }
      } else {
        nav.classList.remove('hidden');
      }
    });

    function triggerRipple(x, y) {
      /* Creates an expanding circle ripple effect from the click point */
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      const size = Math.max(window.innerWidth, window.innerHeight) * 2.5;
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left  = (x - size / 2) + 'px';
      ripple.style.top   = (y - size / 2) + 'px';
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }


    const overlay = document.getElementById('nav-overlay');

    navCloud.addEventListener('click', (e) => {
      e.stopPropagation(); /* prevent immediate close from document listener */
      menuOpen = !menuOpen;
      navMenu.classList.toggle('open', menuOpen);
      document.body.classList.toggle('nav-active', menuOpen);
      /* Show/hide the dim overlay */
      if (overlay) overlay.classList.toggle('visible', menuOpen);
      if (menuOpen) triggerRipple(e.clientX, e.clientY);
    });

    document.addEventListener('click', () => {
      /* Close menu when clicking anywhere outside the nav */
      if (menuOpen) {
        menuOpen = false;
        navMenu.classList.remove('open');
        document.body.classList.remove('nav-active');
        if (overlay) overlay.classList.remove('visible');
      }
    });

    /* ── Touch: prevent ghost click delay on nav cloud ─────────────
       On touch devices we fire the nav toggle on touchend so there
       is no 300ms tap delay.                                        */
    if (document.documentElement.getAttribute('data-touch') === 'true') {
      navCloud.addEventListener('touchend', (e) => {
        e.preventDefault(); // block the ghost click that follows
        menuOpen = !menuOpen;
        navMenu.classList.toggle('open', menuOpen);
        document.body.classList.toggle('nav-active', menuOpen);
        if (typeof overlay !== 'undefined' && overlay) {
          overlay.classList.toggle('visible', menuOpen);
        }
        if (menuOpen) triggerRipple(
          e.changedTouches[0].clientX,
          e.changedTouches[0].clientY
        );
      });
    }
  </script>

  <script>
    /* ── Logo click opens nav ────────────────────────────────────────────
       Clicking the central logo triggers the same nav open behaviour
       as clicking the cloud in the top-left corner.                    */
    document.getElementById('logo-wrap').addEventListener('click', () => {
      const navCloudEl = document.getElementById('nav-cloud');
      if (navCloudEl) navCloudEl.click();
    });

    /* ── Cursor-following tooltip ────────────────────────────────────────
       The hint element is moved to follow the mouse while hovering
       over the logo. Hidden on touch devices.                          */
    const logoWrap = document.getElementById('logo-wrap');
    const hint     = logoWrap.querySelector('.logo-hint');

    if (document.documentElement.getAttribute('data-touch') !== 'true') {
      logoWrap.addEventListener('mouseenter', () => {
        hint.classList.add('visible');
      });
      logoWrap.addEventListener('mouseleave', () => {
        hint.classList.remove('visible');
      });
      logoWrap.addEventListener('mousemove', (e) => {
        hint.style.left = e.clientX + 'px';
        hint.style.top  = e.clientY + 'px';
      });
    }
  </script>
