<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="admin/admin.css">
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────── -->
  <div id="login-screen">
    <h1>admin</h1>
    <div class="field">
      <label for="admin-email">email</label>
      <input type="email" id="admin-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="admin-pwd">password</label>
      <input type="password" id="admin-pwd" autocomplete="current-password" />
      <div class="error-msg" id="pwd-error">Invalid email or password.</div>
    </div>
    <button class="submit" id="login-btn">enter</button>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────────────── -->
  <div id="dashboard">

    <!-- ── Main tab switcher ──────────────────────────────────────────── -->
    <div class="main-tabs" style="position:relative;">
      <button class="logout-btn" id="logout-btn" title="Sign out">logout</button>
      <button class="main-tab active" id="tab-enquiries" data-action="switchTab" data-args="enquiries">enquiries</button>
      <button class="main-tab" id="tab-courses" data-action="switchTab" data-args="courses">courses</button>
      <button class="main-tab" id="tab-companies" data-action="switchTab" data-args="companies">companies</button>
      <button class="main-tab" id="tab-billing" data-action="switchTab" data-args="billing">billing</button>
      <button class="main-tab" id="tab-reports" data-action="switchTab" data-args="reports">reports</button>
      <button class="main-tab" id="tab-teachers" data-action="switchTab" data-args="teachers">teachers</button>
    </div>

    <!-- ── Enquiries panel ───────────────────────────────────────────── -->
    <div id="panel-enquiries">
      <div class="dashboard-header">
        <div class="filter-row">
          <button class="filter-btn active" data-status="all">all</button>
          <button class="filter-btn" data-status="new">new</button>
          <button class="filter-btn" data-status="contacted">contacted</button>
          <button class="filter-btn" data-status="confirmed">confirmed</button>
          <button class="filter-btn" data-status="cancelled">cancelled</button>
        </div>
      </div>
      <div id="enquiry-list" class="enquiry-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Courses panel ─────────────────────────────────────────────── -->
    <!-- ── New course modal ──────────────────────────────────────────── -->
    <div class="modal-overlay" id="new-course-modal">
      <div class="modal modal-wide">
        <h2>new course</h2>

        <div class="modal-grid">
          <div class="modal-field">
            <label>Teacher</label>
            <select id="nc-teacher"><option value="">loading…</option></select>
          </div>
          <div class="modal-field">
            <label>Service</label>
            <select id="nc-service">
              <option value="language course">Language course</option>
              <option value="exam prep">Exam prep</option>
              <option value="tutoring">Tutoring</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Level <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for tutoring)</span></label>
            <select id="nc-level">
              <option value="">—</option>
              <option>A1</option><option>A2</option><option>B1</option>
              <option>B2</option><option>C1</option><option>C2</option>
              <option value="CH">CH (Swiss German)</option>
              <option value="SUB">SUB (Tutoring)</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Group type</label>
            <select id="nc-group">
              <option value="private">Private</option>
              <option value="duo">Duo</option>
              <option value="group">Group</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Sessions in block <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for open-ended)</span></label>
            <input type="number" id="nc-sessions" min="1" placeholder="e.g. 30">
          </div>
          <div class="modal-field">
            <label>First session date &amp; time</label>
            <input type="datetime-local" id="nc-datetime">
          </div>
        </div>

        <p style="font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin:1.2rem 0 0.8rem;">Participants</p>
        <div id="nc-participants">
          <div class="participant-block modal-grid" id="nc-p-0">
            <div class="modal-field"><label>First name</label><input type="text" id="nc-p0-first" placeholder="First name"></div>
            <div class="modal-field"><label>Last name</label><input type="text" id="nc-p0-last" placeholder="Last name"></div>
            <div class="modal-field"><label>Email</label><input type="email" id="nc-p0-email" placeholder="email@example.com"></div>
            <div class="modal-field"><label>Phone</label><input type="tel" id="nc-p0-phone" placeholder="+41…"></div>
          </div>
        </div>
        <button class="add-participant-btn" data-action="addParticipantBlock">+ add participant</button>

        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeNewCourseModal">cancel</button>
          <button class="modal-submit" id="nc-submit" data-action="submitNewCourse">create course &amp; calendar event</button>
        </div>
        <p class="modal-msg" id="nc-msg"></p>
      </div>
    </div>

    <div id="panel-courses" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-course-status="active" data-action="filterCourses" data-args="active">active</button>
          <button class="filter-btn" data-course-status="all" data-action="filterCourses" data-args="all">all</button>
          <button class="filter-btn" data-course-status="completed" data-action="filterCourses" data-args="completed">completed</button>
          <button class="filter-btn" data-course-status="cancelled" data-action="filterCourses" data-args="cancelled">cancelled</button>
        </div>
        <button class="new-course-btn" data-action="openNewCourseModal">+ new course</button>
      </div>
      <div id="course-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Companies panel ───────────────────────────────────────────── -->
    <div id="panel-companies" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-company-status="true" data-action="filterCompanies" data-args="true">active</button>
          <button class="filter-btn" data-company-status="all" data-action="filterCompanies" data-args="all">all</button>
        </div>
        <button class="new-course-btn" data-action="openCompanyModal">+ new company</button>
      </div>
      <div id="company-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Billing panel ──────────────────────────────────────────────── -->
    <div id="panel-billing" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-inv-status="all" data-action="filterInvoices" data-args="all">all</button>
          <button class="filter-btn" data-inv-status="draft" data-action="filterInvoices" data-args="draft">draft</button>
          <button class="filter-btn" data-inv-status="sent" data-action="filterInvoices" data-args="sent">sent</button>
          <button class="filter-btn" data-inv-status="paid" data-action="filterInvoices" data-args="paid">paid</button>
        </div>
        <button class="new-course-btn" data-action="openCreateInvoiceModal">+ new invoice</button>
      </div>
      <div id="invoice-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Create invoice modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="create-invoice-modal">
      <div class="modal modal-wide">
        <h2>create invoice</h2>
        <div class="modal-grid">
          <div class="modal-field">
            <label>Company *</label>
            <select id="inv-company"><option value="">select company…</option></select>
          </div>
          <div class="modal-field">
            <label>VAT rate % <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for no VAT)</span></label>
            <input type="number" id="inv-vat-rate" step="0.1" placeholder="e.g. 8.1">
          </div>
          <div class="modal-field full">
            <label>Notes</label>
            <input type="text" id="inv-notes" placeholder="Optional notes">
          </div>
        </div>
        <p style="font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin:1.2rem 0 0.6rem;">completed sessions (select to include)</p>
        <div id="inv-sessions" style="max-height:300px;overflow-y:auto;">
          <p style="font-size:0.78rem;color:#aaa;">Select a company first.</p>
        </div>
        <div style="margin-top:1rem;padding-top:0.8rem;border-top:1px solid #eee;">
          <span style="font-size:0.82rem;color:#555;" id="inv-total-preview">Total: —</span>
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeCreateInvoiceModal">cancel</button>
          <button class="modal-submit" id="inv-submit" data-action="submitCreateInvoice">create invoice</button>
        </div>
        <p class="modal-msg" id="inv-msg"></p>
      </div>
    </div>

    <!-- ── Invoice detail modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="invoice-detail-modal">
      <div class="modal" style="width:min(92vw,600px);">
        <h2 id="inv-detail-title">invoice</h2>
        <div id="inv-detail-content"></div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeInvoiceDetailModal">close</button>
        </div>
      </div>
    </div>

    <!-- ── Company modal ─────────────────────────────────────────────── -->
    <div class="modal-overlay" id="company-modal">
      <div class="modal modal-wide">
        <h2 id="company-modal-title">new company</h2>
        <input type="hidden" id="cm-id" value="">
        <div class="modal-grid">
          <div class="modal-field full"><label>Company name *</label><input type="text" id="cm-name" placeholder="e.g. UBS AG"></div>
          <div class="modal-field"><label>Contact person</label><input type="text" id="cm-contact-name" placeholder="Full name"></div>
          <div class="modal-field"><label>Contact email</label><input type="email" id="cm-contact-email" placeholder="hr@company.com"></div>
          <div class="modal-field"><label>Contact phone</label><input type="tel" id="cm-contact-phone" placeholder="+41…"></div>
          <div class="modal-field"><label>Billing email</label><input type="email" id="cm-billing-email" placeholder="billing@company.com"></div>
          <div class="modal-field full"><label>Billing address</label><input type="text" id="cm-billing-address" placeholder="Street, PLZ, City"></div>
          <div class="modal-field"><label>VAT number</label><input type="text" id="cm-vat" placeholder="CHE-…"></div>
          <div class="modal-field"><label>Rate per session (CHF)</label><input type="number" id="cm-rate" step="0.01" placeholder="e.g. 180"></div>
          <div class="modal-field full"><label>Notes</label><input type="text" id="cm-notes" placeholder="Internal notes"></div>
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeCompanyModal">cancel</button>
          <button class="modal-submit" id="cm-submit" data-action="submitCompany">save company</button>
        </div>
        <p class="modal-msg" id="cm-msg"></p>
      </div>
    </div>


    <!-- ── Reports panel ──────────────────────────────────────────────── -->
    <div id="panel-reports" style="display:none;">
      <div class="dashboard-header">
        <div class="course-filter-row">
          <button class="filter-btn active" data-report-type="overview" data-action="filterReport" data-args="overview">overview</button>
          <button class="filter-btn" data-report-type="revenue" data-action="filterReport" data-args="revenue">revenue</button>
          <button class="filter-btn" data-report-type="sessions" data-action="filterReport" data-args="sessions">sessions</button>
          <button class="filter-btn" data-report-type="attendance" data-action="filterReport" data-args="attendance">attendance</button>
        </div>
      </div>
      <div id="report-content">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Teachers panel ─────────────────────────────────────────────── -->
    <div id="panel-teachers" style="display:none;">
      <div class="dashboard-header" style="align-items:center;">
        <div class="modal-field" style="margin-bottom:0;min-width:200px;">
          <select id="avail-teacher" data-action-change="onTeacherSelect">
            <option value="">select teacher…</option>
          </select>
        </div>
      </div>
      <div id="availability-content">
        <div class="empty-state">select a teacher to view their schedule</div>
      </div>
    </div>

    <!-- ── Attendance modal ──────────────────────────────────────────── -->
    <div class="modal-overlay" id="attendance-modal">
      <div class="modal">
        <h2 id="att-title">mark attendance</h2>
        <input type="hidden" id="att-session-id" value="">
        <input type="hidden" id="att-course-id" value="">
        <div id="att-students"></div>
        <div class="modal-actions">
          <button class="modal-cancel" data-action="closeAttendanceModal">cancel</button>
          <button class="modal-submit" id="att-submit" data-action="submitAttendance">save attendance</button>
        </div>
        <p class="modal-msg" id="att-msg"></p>
      </div>
    </div>

  </div>

  <script type="module" src="admin/main.js"></script>
</body>
</html>
