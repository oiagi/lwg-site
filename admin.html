<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gioia — admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100vh; }
    body {
      --page-bg: #d6eaf8;
      background-color: #d6eaf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1rem 5rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      transition: background-color 0.6s ease;
    }
    body.nav-active { --page-bg: #b8d9f0; background-color: #b8d9f0; }

    /* ── Login screen ─────────────────────────────────────────────── */
    #login-screen {
      width: min(92vw, 380px);
      margin-top: 2rem;
      animation: fadeUp 0.6s ease both;
    }
    #login-screen h1 {
      font-size: 2rem; font-weight: 300; letter-spacing: 0.08em;
      color: #1a1a1a; margin-bottom: 2.4rem; text-align: center;
    }
    .field { margin-bottom: 1.8rem; }
    label {
      display: block; font-size: 0.72rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: #555; margin-bottom: 0.6rem;
    }
    input[type="password"] {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #1a1a1a; padding: 0.4rem 0;
      font-family: inherit; font-size: 1rem; font-weight: 300;
      color: #1a1a1a; outline: none;
    }
    .error-msg {
      font-size: 0.72rem; color: #c0392b; margin-top: 0.3rem;
      letter-spacing: 0.04em; display: none;
    }
    button.submit {
      margin-top: 1rem; display: block; width: 100%;
      background: #1a1a1a; color: #d6eaf8; border: none; padding: 0.9rem;
      font-family: inherit; font-size: 0.8rem; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button.submit:hover { background: #ffffff; color: #1a1a1a; }

    /* ── Dashboard ────────────────────────────────────────────────── */
    #dashboard { display: none; width: min(96vw, 860px); animation: fadeUp 0.6s ease both; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .dashboard-header h1 {
      font-size: 2rem; font-weight: 300; letter-spacing: 0.08em; color: #1a1a1a;
    }
    .filter-row {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    .filter-btn {
      font-size: 0.75rem; letter-spacing: 0.1em; padding: 0.3rem 0.8rem;
      border: 1px solid #1a1a1a; background: transparent; cursor: pointer;
      font-family: inherit; transition: background 0.15s, color 0.15s;
    }
    .filter-btn.active { background: #1a1a1a; color: #d6eaf8; }

    /* ── Main tabs ────────────────────────────────────────────────── */
    .main-tabs {
      display: flex; gap: 0; margin-bottom: 2rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .main-tab {
      font-family: inherit; font-size: 0.78rem; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 0.6rem 1.4rem;
      border: none; background: transparent; cursor: pointer;
      color: #888; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
    }
    .main-tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
    .main-tab:hover  { color: #1a1a1a; }

    /* ── Course list ──────────────────────────────────────────────── */
    .course-row {
      border-top: 1px solid #ccc; padding: 1rem 0; cursor: pointer;
    }
    .course-row:last-child { border-bottom: 1px solid #ccc; }
    .course-row:hover { background: rgba(255,255,255,0.5); }
    .course-summary {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    }
    .course-code {
      font-size: 0.9rem; letter-spacing: 0.08em; color: #1a1a1a; min-width: 100px;
    }
    .course-participants {
      font-size: 0.85rem; color: #555; flex: 1;
    }
    .course-sessions {
      font-size: 0.78rem; color: #888; letter-spacing: 0.04em; white-space: nowrap;
    }
    .course-status {
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .course-status.active    { color: #27ae60; }
    .course-status.paused    { color: #e67e22; }
    .course-status.completed { color: #2980b9; }
    .course-status.cancelled { color: #c0392b; }
    .course-detail {
      display: none; padding: 1rem 0 0.5rem; border-top: 1px solid #eee; margin-top: 0.8rem;
    }
    .course-detail.open { display: block; }
    .session-row {
      display: flex; gap: 1rem; align-items: center;
      padding: 0.4rem 0; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap;
    }
    .session-date { font-size: 0.82rem; color: #555; min-width: 160px; }
    .session-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .session-status-dot.scheduled  { background: #aaa; }
    .session-status-dot.completed  { background: #27ae60; }
    .session-status-dot.cancelled  { background: #c0392b; }
    .log-btn {
      font-family: inherit; font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid #27ae60; background: transparent;
      color: #27ae60; padding: 0.2rem 0.6rem; cursor: pointer; margin-left: auto;
      transition: background 0.15s, color 0.15s;
    }
    .log-btn:hover { background: #27ae60; color: #fff; }
    .cancel-btn {
      font-family: inherit; font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid #c0392b; background: transparent;
      color: #c0392b; padding: 0.2rem 0.6rem; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .cancel-btn:hover { background: #c0392b; color: #fff; }
    .course-filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .new-course-btn {
      font-family: inherit; font-size: 0.75rem; letter-spacing: 0.14em;
      text-transform: uppercase; border: 1px solid #1a1a1a;
      background: #1a1a1a; color: #d6eaf8; padding: 0.3rem 0.9rem;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .new-course-btn:hover { background: #fff; color: #1a1a1a; }
    .delete-course-btn {
      font-family: inherit; font-size: 0.68rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid #c0392b;
      background: transparent; color: #c0392b; padding: 0.2rem 0.6rem;
      cursor: pointer; margin-left: auto; transition: background 0.15s, color 0.15s;
    }
    .delete-course-btn:hover { background: #c0392b; color: #fff; }
    /* ── New course modal ─────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(214,234,248,0.85); backdrop-filter: blur(3px);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; padding: 2rem; width: min(92vw, 500px);
      max-height: 90vh; overflow-y: auto;
      animation: fadeUp 0.2s ease both;
    }
    .modal h2 {
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: #555; margin-bottom: 1.6rem;
    }
    .modal-field { margin-bottom: 1.2rem; }
    .modal-field label {
      display: block; font-size: 0.68rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #aaa; margin-bottom: 0.4rem;
    }
    .modal-field input, .modal-field select {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #ddd; font-family: inherit;
      font-size: 0.88rem; font-weight: 300; color: #1a1a1a;
      outline: none; padding: 0.3rem 0;
    }
    .modal-field select { appearance: none; cursor: pointer; }
    .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
    .modal-submit {
      font-family: inherit; font-size: 0.75rem; letter-spacing: 0.14em;
      text-transform: uppercase; background: #1a1a1a; color: #d6eaf8;
      border: 1px solid #1a1a1a; padding: 0.5rem 1.2rem; cursor: pointer;
      transition: background 0.15s, color 0.15s; flex: 1;
    }
    .modal-submit:hover { background: #fff; color: #1a1a1a; }
    .modal-cancel {
      font-family: inherit; font-size: 0.75rem; letter-spacing: 0.14em;
      text-transform: uppercase; background: transparent; color: #aaa;
      border: 1px solid #ddd; padding: 0.5rem 1.2rem; cursor: pointer;
    }
    .modal-cancel:hover { color: #1a1a1a; border-color: #1a1a1a; }
    .modal-msg { font-size: 0.75rem; margin-top: 0.8rem; display: none; }
    .modal-msg.err { color: #c0392b; }
    .modal-msg.ok  { color: #27ae60; }
    .participant-block { border-top: 1px solid #f0f0f0; padding-top: 1rem; margin-top: 0.4rem; }
    .participant-block label { color: #888; }
    .add-participant-btn {
      font-family: inherit; font-size: 0.68rem; letter-spacing: 0.1em;
      text-transform: uppercase; background: transparent; border: none;
      color: #aaa; cursor: pointer; padding: 0; margin-top: 0.6rem;
    }
    .add-participant-btn:hover { color: #1a1a1a; }

    /* ── Enquiry table ────────────────────────────────────────────── */
    .enquiry-list { display: flex; flex-direction: column; gap: 0; }
    .enquiry-row {
      border-top: 1px solid #ccc; cursor: pointer;
      transition: background 0.15s;
    }
    .enquiry-row:last-child { border-bottom: 1px solid #ccc; }
    .enquiry-row:hover { background: rgba(255,255,255,0.5); }
    .enquiry-summary {
      display: grid;
      grid-template-columns: 1.6rem 1fr 130px 80px 90px;
      gap: 0 1rem; align-items: center; padding: 0.9rem 0.5rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ccc;
    }
    .dot.new       { background: #2ecc71; }
    .dot.contacted { background: #f39c12; }
    .dot.confirmed { background: #3498db; }
    .dot.cancelled { background: #e74c3c; }
    .enq-name  { font-size: 0.95rem; color: #1a1a1a; }
    .enq-svc   { font-size: 0.72rem; letter-spacing: 0.08em; color: #777; text-transform: uppercase; }
    .enq-date  { font-size: 0.72rem; color: #999; text-align: right; }
    .enq-status {
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: #777; text-align: right;
    }
    .enq-status.new       { color: #27ae60; }
    .enq-status.contacted { color: #e67e22; }
    .enq-status.confirmed { color: #2980b9; }
    .enq-status.cancelled { color: #c0392b; }

    /* ── Expanded detail ──────────────────────────────────────────── */
    .enquiry-detail {
      display: none; padding: 0 0.5rem 1.4rem;
      border-top: 1px dashed #ddd;
    }
    .enquiry-detail.open { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; }
    .detail-section { margin-bottom: 0; }
    .detail-label {
      font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: #aaa; margin-bottom: 0.6rem; padding-bottom: 0.3rem;
      border-bottom: 1px solid #eee;
    }
    .detail-row { display: flex; gap: 0.5rem; margin-bottom: 0.35rem; }
    .detail-key  { font-size: 0.72rem; color: #888; min-width: 100px; flex-shrink: 0; }
    .detail-val  { font-size: 0.78rem; color: #1a1a1a; }
    .detail-actions {
      margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    .status-select {
      font-family: inherit; font-size: 0.75rem; letter-spacing: 0.06em;
      border: 1px solid #1a1a1a; background: transparent; padding: 0.3rem 0.5rem;
      color: #1a1a1a; cursor: pointer; outline: none;
    }
    .save-btn {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; border: 1px solid #1a1a1a; background: #1a1a1a;
      color: #d6eaf8; padding: 0.3rem 0.8rem; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .save-btn:hover { background: transparent; color: #1a1a1a; }
    .delete-btn {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; border: 1px solid #c0392b; background: transparent;
      color: #c0392b; padding: 0.3rem 0.8rem; cursor: pointer; margin-left: auto;
      transition: background 0.15s, color 0.15s;
    }
    .delete-btn:hover { background: #c0392b; color: #fff; }
    .confirm-panel {
      margin-top: 1.4rem; padding: 1.2rem; background: rgba(255,255,255,0.5);
      border: 1px solid #ddd;
    }
    .confirm-panel-title {
      font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: #888; margin-bottom: 1rem;
    }
    .confirm-field { margin-bottom: 1rem; }
    .confirm-field label {
      display: block; font-size: 0.68rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: #555; margin-bottom: 0.4rem;
    }
    .confirm-field input,
    .confirm-field select {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #1a1a1a; padding: 0.3rem 0;
      font-family: inherit; font-size: 0.9rem; font-weight: 300;
      color: #1a1a1a; outline: none;
    }
    .confirm-field select { appearance: none; cursor: pointer; }
    .confirm-btn {
      margin-top: 0.8rem; width: 100%; background: #1a1a1a; color: #d6eaf8;
      border: none; padding: 0.7rem; font-family: inherit; font-size: 0.78rem;
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .confirm-btn:hover { background: #fff; color: #1a1a1a; }
    .confirm-msg { font-size: 0.75rem; margin-top: 0.6rem; display: none; }
    .confirm-msg.ok  { color: #27ae60; }
    .confirm-msg.err { color: #c0392b; }
    .auth-link {
      font-size: 0.72rem; color: #888; letter-spacing: 0.06em;
      text-decoration: none; border-bottom: 1px solid #ccc;
    }
    .auth-link:hover { border-color: #888; }
    .notes-input {
      width: 100%; font-family: inherit; font-size: 0.82rem; font-weight: 300;
      border: none; border-bottom: 1px solid #ccc; background: transparent;
      padding: 0.3rem 0; color: #1a1a1a; outline: none; margin-top: 0.4rem;
      resize: none; height: 60px;
    }
    .saved-msg {
      font-size: 0.7rem; color: #27ae60; letter-spacing: 0.06em; display: none;
    }

    .empty-state {
      text-align: center; padding: 3rem 0; color: #aaa;
      font-size: 0.9rem; letter-spacing: 0.06em;
    }
    .loading-state {
      text-align: center; padding: 3rem 0; color: #aaa;
      font-size: 0.85rem; letter-spacing: 0.08em; animation: fadeUp 0.4s ease both;
    }

    html[data-device="mobile"] body { padding: 4rem 0.5rem 3rem; }
    html[data-device="mobile"] #dashboard { width: 98vw; }
    html[data-device="mobile"] .enquiry-summary {
      grid-template-columns: 1.2rem 1fr 70px;
    }
    html[data-device="mobile"] .enq-svc,
    html[data-device="mobile"] .enq-date { display: none; }
    html[data-device="mobile"] .enquiry-detail.open { grid-template-columns: 1fr; }
    html[data-device="mobile"] .detail-key { min-width: 80px; }

    /* ── Company rows ──────────────────────────────────────────────── */
    .company-row {
      border-top: 1px solid #ccc; padding: 1rem 0; cursor: pointer;
    }
    .company-row:last-child { border-bottom: 1px solid #ccc; }
    .company-row:hover { background: rgba(255,255,255,0.5); }
    .company-summary {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    }
    .company-name {
      font-size: 0.95rem; color: #1a1a1a; min-width: 160px;
    }
    .company-contact {
      font-size: 0.82rem; color: #555; flex: 1;
    }
    .company-stats {
      font-size: 0.78rem; color: #888; letter-spacing: 0.04em; white-space: nowrap;
    }
    .company-detail {
      display: none; padding: 1rem 0 0.5rem; border-top: 1px solid #eee; margin-top: 0.8rem;
    }
    .company-detail.open { display: block; }

    /* ── Attendance checkbox row ────────────────────────────────────── */
    .att-row {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .att-row label {
      font-size: 0.85rem; color: #1a1a1a; cursor: pointer;
      display: flex; align-items: center; gap: 0.5rem;
      text-transform: none; letter-spacing: 0;
    }
    .att-row input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #27ae60;
    }
    .att-status {
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
      margin-left: auto;
    }
    .att-status.present { color: #27ae60; }
    .att-status.absent  { color: #c0392b; }

    /* ── Recurring / attendance action buttons ──────────────────────── */
    .action-btn {
      font-family: inherit; font-size: 0.68rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid #2980b9; background: transparent;
      color: #2980b9; padding: 0.2rem 0.6rem; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background: #2980b9; color: #fff; }

    /* ── Invoice rows ──────────────────────────────────────────────── */
    .invoice-row {
      border-top: 1px solid #ccc; padding: 0.8rem 0; cursor: pointer;
      transition: background 0.15s;
    }
    .invoice-row:last-child { border-bottom: 1px solid #ccc; }
    .invoice-row:hover { background: rgba(255,255,255,0.5); }
    .invoice-summary {
      display: grid;
      grid-template-columns: 140px 1fr 100px 80px 90px;
      gap: 0 1rem; align-items: center;
    }
    .inv-number  { font-size: 0.88rem; color: #1a1a1a; letter-spacing: 0.04em; }
    .inv-company { font-size: 0.85rem; color: #555; }
    .inv-amount  { font-size: 0.88rem; color: #1a1a1a; text-align: right; }
    .inv-date    { font-size: 0.72rem; color: #999; text-align: right; }
    .inv-status {
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
      text-align: right;
    }
    .inv-status.draft     { color: #888; }
    .inv-status.sent      { color: #e67e22; }
    .inv-status.paid      { color: #27ae60; }
    .inv-status.cancelled { color: #c0392b; }
    .inv-session-check {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .inv-session-check label {
      font-size: 0.82rem; color: #555; display: flex; align-items: center;
      gap: 0.5rem; cursor: pointer; text-transform: none; letter-spacing: 0;
    }
    .inv-session-check input[type="checkbox"] {
      width: 15px; height: 15px; cursor: pointer; accent-color: #2980b9;
    }
    html[data-device="mobile"] .invoice-summary {
      grid-template-columns: 1fr 80px 70px;
    }
    html[data-device="mobile"] .inv-company,
    html[data-device="mobile"] .inv-date { display: none; }
  </style>
  <!-- ── Device detection ─────────────────────────────────────────────
       Runs synchronously before first paint to set data-device on <html>.
       Detects phone / tablet / desktop using screen size + pointer type
       + user-agent so CSS can adapt per device class.                  -->
  <script src="device-detect.js"></script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────── -->
  <div id="login-screen">
    <h1>admin</h1>
    <div class="field">
      <label for="admin-pwd">password</label>
      <input type="password" id="admin-pwd" autocomplete="current-password" />
      <div class="error-msg" id="pwd-error">Incorrect password.</div>
    </div>
    <button class="submit" id="login-btn">enter</button>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────────────── -->
  <div id="dashboard">

    <!-- ── Main tab switcher ──────────────────────────────────────────── -->
    <div class="main-tabs">
      <button class="main-tab active" id="tab-enquiries" onclick="switchTab('enquiries')">enquiries</button>
      <button class="main-tab" id="tab-courses" onclick="switchTab('courses')">courses</button>
      <button class="main-tab" id="tab-companies" onclick="switchTab('companies')">companies</button>
      <button class="main-tab" id="tab-billing" onclick="switchTab('billing')">billing</button>
    </div>

    <!-- ── Enquiries panel ───────────────────────────────────────────── -->
    <div id="panel-enquiries">
      <div class="dashboard-header">
        <div class="filter-row">
          <button class="filter-btn active" data-status="all">all</button>
          <button class="filter-btn" data-status="new">new</button>
          <button class="filter-btn" data-status="contacted">contacted</button>
          <button class="filter-btn" data-status="confirmed">confirmed</button>
          <button class="filter-btn" data-status="cancelled">cancelled</button>
        </div>
      </div>
      <div id="enquiry-list" class="enquiry-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Courses panel ─────────────────────────────────────────────── -->
    <!-- ── New course modal ──────────────────────────────────────────── -->
    <div class="modal-overlay" id="new-course-modal">
      <div class="modal">
        <h2>new course</h2>

        <div class="modal-field">
          <label>Teacher</label>
          <select id="nc-teacher"><option value="">loading…</option></select>
        </div>
        <div class="modal-field">
          <label>Service</label>
          <select id="nc-service">
            <option value="language course">Language course</option>
            <option value="exam prep">Exam prep</option>
            <option value="tutoring">Tutoring</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Level <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for tutoring)</span></label>
          <select id="nc-level">
            <option value="">—</option>
            <option>A1</option><option>A2</option><option>B1</option>
            <option>B2</option><option>C1</option><option>C2</option>
            <option value="CH">CH (Swiss German)</option>
            <option value="SUB">SUB (Tutoring)</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Group type</label>
          <select id="nc-group">
            <option value="private">Private</option>
            <option value="duo">Duo</option>
            <option value="group">Group</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Sessions in block <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for open-ended)</span></label>
          <input type="number" id="nc-sessions" min="1" placeholder="e.g. 30">
        </div>
        <div class="modal-field">
          <label>First session date &amp; time</label>
          <input type="datetime-local" id="nc-datetime">
        </div>

        <p style="font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin:1.2rem 0 0.8rem;">Participants</p>
        <div id="nc-participants">
          <div class="participant-block" id="nc-p-0">
            <div class="modal-field"><label>First name</label><input type="text" id="nc-p0-first" placeholder="First name"></div>
            <div class="modal-field"><label>Last name</label><input type="text" id="nc-p0-last" placeholder="Last name"></div>
            <div class="modal-field"><label>Email</label><input type="email" id="nc-p0-email" placeholder="email@example.com"></div>
            <div class="modal-field"><label>Phone</label><input type="tel" id="nc-p0-phone" placeholder="+41…"></div>
          </div>
        </div>
        <button class="add-participant-btn" onclick="addParticipantBlock()">+ add participant</button>

        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeNewCourseModal()">cancel</button>
          <button class="modal-submit" id="nc-submit" onclick="submitNewCourse()">create course &amp; calendar event</button>
        </div>
        <p class="modal-msg" id="nc-msg"></p>
      </div>
    </div>

    <div id="panel-courses" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-course-status="active" onclick="filterCourses('active')">active</button>
          <button class="filter-btn" data-course-status="all" onclick="filterCourses('all')">all</button>
          <button class="filter-btn" data-course-status="completed" onclick="filterCourses('completed')">completed</button>
          <button class="filter-btn" data-course-status="cancelled" onclick="filterCourses('cancelled')">cancelled</button>
        </div>
        <button class="new-course-btn" onclick="openNewCourseModal()">+ new course</button>
      </div>
      <div id="course-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Companies panel ───────────────────────────────────────────── -->
    <div id="panel-companies" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-company-status="true" onclick="filterCompanies('true')">active</button>
          <button class="filter-btn" data-company-status="all" onclick="filterCompanies('all')">all</button>
        </div>
        <button class="new-course-btn" onclick="openCompanyModal()">+ new company</button>
      </div>
      <div id="company-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Billing panel ──────────────────────────────────────────────── -->
    <div id="panel-billing" style="display:none;">
      <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
        <div class="course-filter-row">
          <button class="filter-btn active" data-inv-status="all" onclick="filterInvoices('all')">all</button>
          <button class="filter-btn" data-inv-status="draft" onclick="filterInvoices('draft')">draft</button>
          <button class="filter-btn" data-inv-status="sent" onclick="filterInvoices('sent')">sent</button>
          <button class="filter-btn" data-inv-status="paid" onclick="filterInvoices('paid')">paid</button>
        </div>
        <button class="new-course-btn" onclick="openCreateInvoiceModal()">+ new invoice</button>
      </div>
      <div id="invoice-list">
        <div class="loading-state">loading…</div>
      </div>
    </div>

    <!-- ── Create invoice modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="create-invoice-modal">
      <div class="modal">
        <h2>create invoice</h2>
        <div class="modal-field">
          <label>Company *</label>
          <select id="inv-company"><option value="">select company…</option></select>
        </div>
        <div class="modal-field">
          <label>VAT rate % <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(leave blank for no VAT)</span></label>
          <input type="number" id="inv-vat-rate" step="0.1" placeholder="e.g. 8.1">
        </div>
        <div class="modal-field">
          <label>Notes</label>
          <input type="text" id="inv-notes" placeholder="Optional notes">
        </div>
        <p style="font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin:1.2rem 0 0.6rem;">completed sessions (select to include)</p>
        <div id="inv-sessions" style="max-height:300px;overflow-y:auto;">
          <p style="font-size:0.78rem;color:#aaa;">Select a company first.</p>
        </div>
        <div style="margin-top:1rem;padding-top:0.8rem;border-top:1px solid #eee;">
          <span style="font-size:0.82rem;color:#555;" id="inv-total-preview">Total: —</span>
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeCreateInvoiceModal()">cancel</button>
          <button class="modal-submit" id="inv-submit" onclick="submitCreateInvoice()">create invoice</button>
        </div>
        <p class="modal-msg" id="inv-msg"></p>
      </div>
    </div>

    <!-- ── Invoice detail modal ────────────────────────────────────────── -->
    <div class="modal-overlay" id="invoice-detail-modal">
      <div class="modal" style="width:min(92vw,600px);">
        <h2 id="inv-detail-title">invoice</h2>
        <div id="inv-detail-content"></div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeInvoiceDetailModal()">close</button>
        </div>
      </div>
    </div>

    <!-- ── Company modal ─────────────────────────────────────────────── -->
    <div class="modal-overlay" id="company-modal">
      <div class="modal">
        <h2 id="company-modal-title">new company</h2>
        <input type="hidden" id="cm-id" value="">
        <div class="modal-field"><label>Company name *</label><input type="text" id="cm-name" placeholder="e.g. UBS AG"></div>
        <div class="modal-field"><label>Contact person</label><input type="text" id="cm-contact-name" placeholder="Full name"></div>
        <div class="modal-field"><label>Contact email</label><input type="email" id="cm-contact-email" placeholder="hr@company.com"></div>
        <div class="modal-field"><label>Contact phone</label><input type="tel" id="cm-contact-phone" placeholder="+41…"></div>
        <div class="modal-field"><label>Billing address</label><input type="text" id="cm-billing-address" placeholder="Street, PLZ, City"></div>
        <div class="modal-field"><label>Billing email</label><input type="email" id="cm-billing-email" placeholder="billing@company.com"></div>
        <div class="modal-field"><label>VAT number</label><input type="text" id="cm-vat" placeholder="CHE-…"></div>
        <div class="modal-field"><label>Rate per session (CHF)</label><input type="number" id="cm-rate" step="0.01" placeholder="e.g. 180"></div>
        <div class="modal-field"><label>Notes</label><input type="text" id="cm-notes" placeholder="Internal notes"></div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeCompanyModal()">cancel</button>
          <button class="modal-submit" id="cm-submit" onclick="submitCompany()">save company</button>
        </div>
        <p class="modal-msg" id="cm-msg"></p>
      </div>
    </div>

    <!-- ── Recurring sessions modal ──────────────────────────────────── -->
    <div class="modal-overlay" id="recurring-modal">
      <div class="modal">
        <h2>schedule recurring sessions</h2>
        <input type="hidden" id="rs-course-id" value="">
        <div class="modal-field"><label>Start date</label><input type="date" id="rs-start-date"></div>
        <div class="modal-field"><label>Time</label><input type="time" id="rs-time" value="09:00"></div>
        <div class="modal-field"><label>Number of sessions</label><input type="number" id="rs-count" min="1" max="52" value="20" placeholder="e.g. 20"></div>
        <div class="modal-field"><label>Duration (minutes)</label><input type="number" id="rs-duration" min="15" max="180" value="50"></div>
        <div class="modal-field">
          <label>Skip dates <span style="font-size:0.65rem;color:#ccc;text-transform:none;">(comma-separated, e.g. 2025-12-25, 2026-01-01)</span></label>
          <input type="text" id="rs-skip" placeholder="YYYY-MM-DD, YYYY-MM-DD, …">
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeRecurringModal()">cancel</button>
          <button class="modal-submit" id="rs-submit" onclick="submitRecurringSessions()">create sessions</button>
        </div>
        <p class="modal-msg" id="rs-msg"></p>
      </div>
    </div>

    <!-- ── Attendance modal ──────────────────────────────────────────── -->
    <div class="modal-overlay" id="attendance-modal">
      <div class="modal">
        <h2 id="att-title">mark attendance</h2>
        <input type="hidden" id="att-session-id" value="">
        <input type="hidden" id="att-course-id" value="">
        <div id="att-students"></div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeAttendanceModal()">cancel</button>
          <button class="modal-submit" id="att-submit" onclick="submitAttendance()">save attendance</button>
        </div>
        <p class="modal-msg" id="att-msg"></p>
      </div>
    </div>

  </div>

  <script src="nav.js"></script>
  <script src="admin.js"></script>
</body>
</html>
